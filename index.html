<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tracking Pengiriman Toko</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    },
                    animation: {
                        'shimmer': 'shimmer 2.5s infinite linear',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .shimmer-bg {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300 pb-10">

    <!-- MODAL LOGIN AWAL -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-emerald-500 via-teal-500 to-indigo-600"></div>
            
            <div class="text-center mb-6 pt-2">
                <!-- Logo Alfamidi pada Modal Login -->
                <div class="w-20 h-20 rounded-2xl bg-white/10 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 flex items-center justify-center mx-auto mb-3 shadow-md">
                    <img src="logo alfamidi.png" 
                         onerror="this.onerror=null; this.src='logo alfamidi.jpg'; if(!this.src.endsWith('jpeg')) this.src='logo alfamidi.jpeg'; if(!this.src.endsWith('svg')) this.src='logo alfamidi.svg';" 
                         alt="Logo Alfamidi" 
                         class="w-full h-full object-contain">
                </div>
                <h2 class="text-lg font-extrabold text-slate-800 dark:text-slate-100">System Tracking Online Branch Manado</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Silakan login untuk memantau pengiriman barang</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <!-- NIK Input -->
                <div>
                    <label for="nikInput" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">NIK (Nomor Induk Karyawan)</label>
                    <div class="relative">
                        <input type="text" id="nikInput" required placeholder="Masukkan NIK Anda..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-sm rounded-xl pl-9 pr-3 py-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
                        <i class="fa-solid fa-id-card absolute left-3 top-3.5 text-slate-400 text-xs"></i>
                    </div>
                </div>

                <!-- Jabatan Dropdown -->
                <div>
                    <label for="jabatanSelect" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Jabatan</label>
                    <div class="relative">
                        <select id="jabatanSelect" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-sm rounded-xl pl-9 pr-3 py-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
                            <option value="" disabled selected>-- Pilih Jabatan --</option>
                            <option value="COS">COS</option>
                            <option value="ACOS">ACOS</option>
                            <option value="MD FRESH">MD FRESH</option>
                            <option value="CREW">CREW</option>
                        </select>
                        <i class="fa-solid fa-user-tie absolute left-3 top-3.5 text-slate-400 text-xs"></i>
                    </div>
                </div>

                <!-- Password Input Dinamis Tanggal HP User (DDMMYYYY) -->
                <div>
                    <label for="passwordInput" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="passwordInput" required placeholder="Silahkan isi password" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-sm rounded-xl pl-9 pr-3 py-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
                        <i class="fa-solid fa-lock absolute left-3 top-3.5 text-slate-400 text-xs"></i>
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm py-3 rounded-xl shadow-lg hover:shadow-emerald-500/20 active:scale-[0.98] transition-all flex items-center justify-center space-x-2 mt-2">
                    <span>Masuk Dashboard</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- HEADER DASHBOARD -->
    <header class="sticky top-0 z-40 bg-slate-900/90 text-white backdrop-blur-xl border-b border-slate-800 shadow-xl overflow-hidden">
        <div class="absolute inset-0 shimmer-bg animate-shimmer pointer-events-none"></div>
        <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between relative z-10">
            <!-- Logo Perusahaan -->
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-white/10 border border-white/20 p-1 flex items-center justify-center overflow-hidden shadow-inner shrink-0">
                    <img src="logo alfamidi.png" 
                         onerror="this.onerror=null; this.src='logo alfamidi.jpg'; if(!this.src.endsWith('jpeg')) this.src='logo alfamidi.jpeg'; if(!this.src.endsWith('svg')) this.src='logo alfamidi.svg';" 
                         alt="Logo Alfamidi" 
                         class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="font-extrabold text-xs tracking-wide text-emerald-400 flex items-center gap-1">
                        <span>TRACKING KIRIMAN</span>
                        <span class="inline-flex items-center px-1 py-0.2 rounded-full text-[8px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping mr-0.5"></span>LIVE
                        </span>
                    </h1>
                    <p class="text-[9px] text-slate-400 font-medium">Monitoring Armada Toko</p>
                </div>
            </div>

            <!-- Kanan Atas: Copyright / Credit & Controls -->
            <div class="flex flex-col items-end gap-1">
                <!-- Copyright & Inspiration (Pojok Kanan Atas) -->
                <div class="text-[9px] text-slate-400 leading-none">
                    © <span class="font-bold text-slate-200">Gagas</span> <span class="text-slate-500">|</span> Insp. <span class="font-bold text-slate-200">MNO</span>
                </div>

                <!-- Dark / Light Mode Toggle & Reload -->
                <div class="flex items-center space-x-1.5">
                    <button id="refreshBtn" onclick="fetchData()" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 flex items-center justify-center transition active:scale-95" title="Refresh Data">
                        <i class="fa-solid fa-rotate text-[10px]" id="refreshIcon"></i>
                    </button>
                    <button id="themeToggle" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-400 flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-sun text-[10px]" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-md mx-auto px-4 pt-4 flex-1 w-full space-y-4">
        <!-- FILTER CONTAINER -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 shadow-sm space-y-3">
            <div class="grid grid-cols-1 gap-2.5">
                <!-- Dropdown Tanggal Loading -->
                <div>
                    <label for="filterDate" class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1 flex items-center gap-1">
                        <i class="fa-regular fa-calendar-check text-emerald-500"></i> Tanggal Loading
                    </label>
                    <select id="filterDate" onchange="filterAndRenderData()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-slate-800 dark:text-slate-100 text-xs rounded-xl p-2.5 font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
                        <option value="ALL">Semua Tanggal Loading</option>
                    </select>
                </div>

                <!-- Pencarian Toko -->
                <div>
                    <label for="searchQuery" class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1 flex items-center gap-1">
                        <i class="fa-solid fa-magnifying-glass text-emerald-500"></i> Cari Toko / Nopol / Faktur
                    </label>
                    <div class="relative">
                        <input type="text" id="searchQuery" onkeyup="filterAndRenderData()" placeholder="Ketik Kode/Nama Toko, Nopol..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-slate-800 dark:text-slate-100 text-xs rounded-xl pl-8 pr-3 py-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
                        <i class="fa-solid fa-store absolute left-3 top-3 text-slate-400 text-xs"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- LIST PENGIRIMAN DENGAN UNGGULAN RELEVANCE & TIME SORT -->
        <div id="shipmentContainer" class="space-y-4">
            <!-- Loading State -->
            <div class="text-center py-12 space-y-3">
                <div class="inline-block w-10 h-10 border-4 border-emerald-500/30 border-t-emerald-500 rounded-full animate-spin"></div>
                <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">Memuat data pengiriman terbaru...</p>
            </div>
        </div>
    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw_FOTQ2bwkFc0mXy915R2I-NEcSenjNxpWlF8XDo0x4lsQ6UCtbO2MC_GREJMuCzzhfg/exec";
        let rawShipmentData = [];
        let autoRefreshTimer = null;

        // Theme Toggle Setup
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            themeIcon.className = isDark ? 'fa-solid fa-sun text-xs' : 'fa-solid fa-moon text-xs';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Initialize Theme
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
            themeIcon.className = 'fa-solid fa-moon text-xs';
        }

        // Generator Password Tanggal Hari Ini (DDMMYYYY) dari Perangkat HP User
        function getTodayPassword() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            return `${day}${month}${year}`;
        }

        // Handle Form Login Submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputPass = document.getElementById('passwordInput').value.trim();
            const expectedPass = getTodayPassword();

            if (inputPass !== expectedPass) {
                alert('Password salah. Silahkan isi password!');
                return;
            }

            // Jika Password Benar, Tutup Modal Login
            document.getElementById('loginModal').classList.add('hidden');
            
            // Simpan NIK & Jabatan ke sheet Monitoring User
            saveUserLogin(
                document.getElementById('nikInput').value.trim(),
                document.getElementById('jabatanSelect').value
            );

            // Ambil Data Dashboard
            fetchData();
        });

        // Simpan Data User Login ke Backend
        function saveUserLogin(nik, jabatan) {
            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'login',
                    nik: nik,
                    jabatan: jabatan
                })
            }).catch(err => console.error("Error logging user:", err));
        }

        // Fetch Data Pengiriman
        async function fetchData() {
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('animate-spin');

            try {
                const response = await fetch(`${API_URL}?_nocache=${new Date().getTime()}`);
                const result = await response.json();

                if (result.status === "success") {
                    rawShipmentData = result.data || [];
                    populateDateDropdown(rawShipmentData);
                    filterAndRenderData();
                } else {
                    showError("Gagal mengambil data dari spreadsheet");
                }
            } catch (err) {
                console.error(err);
                showError("Gagal terhubung ke server backend.");
            } finally {
                refreshIcon.classList.remove('animate-spin');
            }
        }

        // Fill Tanggal Loading Dropdown
        function populateDateDropdown(data) {
            const dateSelect = document.getElementById('filterDate');
            const currentSelected = dateSelect.value;
            const uniqueDates = [...new Set(data.map(item => item.tglLoading).filter(Boolean))];

            dateSelect.innerHTML = '<option value="ALL">Semua Tanggal Loading</option>';
            uniqueDates.forEach(dateStr => {
                const opt = document.createElement('option');
                opt.value = dateStr;
                opt.textContent = dateStr;
                dateSelect.appendChild(opt);
            });

            if (uniqueDates.includes(currentSelected)) {
                dateSelect.value = currentSelected;
            }
        }

        // Filter Data & Render Tampilan
        function filterAndRenderData() {
            const dateFilter = document.getElementById('filterDate').value;
            const query = document.getElementById('searchQuery').value.toLowerCase().trim();

            const filtered = rawShipmentData.filter(item => {
                const matchDate = (dateFilter === "ALL" || item.tglLoading === dateFilter);
                const matchQuery = !query || 
                    (item.kodeToko && item.kodeToko.toLowerCase().includes(query)) ||
                    (item.namaToko && item.namaToko.toLowerCase().includes(query)) ||
                    (item.nopol && item.nopol.toLowerCase().includes(query)) ||
                    (item.noFaktur && item.noFaktur.toLowerCase().includes(query));
                return matchDate && matchQuery;
            });

            renderShipments(filtered);
        }

        // Render Pengelompokan Per NOPOL
        function renderShipments(data) {
            const container = document.getElementById('shipmentContainer');
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center space-y-2">
                        <i class="fa-solid fa-truck-ramp-box text-3xl text-slate-400"></i>
                        <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">Tidak ada data pengiriman ditemukan.</p>
                    </div>`;
                return;
            }

            // Grouping by NOPOL
            const grouped = {};
            data.forEach(item => {
                const key = item.nopol || "ARMADA LAINNYA";
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(item);
            });

            let html = '';

            Object.keys(grouped).forEach(nopol => {
                const items = grouped[nopol];

                html += `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                    <!-- NOPOL HEADER -->
                    <div class="bg-gradient-to-r from-slate-800 to-slate-900 text-white p-3 px-4 flex items-center justify-between border-b border-slate-700/50">
                        <div class="flex items-center space-x-2">
                            <span class="w-7 h-7 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 flex items-center justify-center text-xs font-bold">
                                <i class="fa-solid fa-truck-fast"></i>
                            </span>
                            <div>
                                <h3 class="font-extrabold text-sm tracking-wide text-amber-400">${nopol}</h3>
                                <p class="text-[10px] text-slate-400 font-medium">${items.length} Toko Kiriman</p>
                            </div>
                        </div>
                    </div>

                    <!-- LIST TOKO DALAM ARMADA INI -->
                    <div class="p-3 space-y-3 divide-y divide-slate-100 dark:divide-slate-800/80">
                `;

                items.forEach((item, idx) => {
                    const statusObj = calculateStatus(item);

                    html += `
                        <div class="${idx > 0 ? 'pt-3' : ''} space-y-2.5">
                            <!-- Header Toko & Status -->
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <div class="flex items-center space-x-1.5">
                                        <span class="text-[11px] font-bold px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300">#${item.nomor || (idx + 1)}</span>
                                        <h4 class="font-bold text-xs text-slate-900 dark:text-slate-100">${item.kodeToko} - ${item.namaToko}</h4>
                                    </div>
                                    <div class="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5 flex items-center gap-2">
                                        <span><i class="fa-solid fa-map-pin text-rose-500 mr-1"></i>${item.wilayah}</span>
                                    </div>
                                </div>
                                <div>
                                    ${statusObj.badgeHtml}
                                </div>
                            </div>

                            <!-- Waktu & Estimasi Tiba (Jam Diperbesar) -->
                            <div class="grid grid-cols-2 gap-2 bg-slate-50 dark:bg-slate-950/60 p-2.5 rounded-xl border border-slate-200/60 dark:border-slate-800/60">
                                <div>
                                    <span class="text-[10px] font-bold text-slate-400 block uppercase">Jam Berangkat</span>
                                    <span class="text-base font-extrabold text-slate-800 dark:text-slate-100">${item.jamBerangkat || '-'}</span>
                                    <span class="text-[9px] text-slate-500 dark:text-slate-400 block font-medium">${item.tglLoading || ''}</span>
                                </div>
                                <div>
                                    <span class="text-[10px] font-bold text-slate-400 block uppercase">EST Sampai</span>
                                    <span class="text-base font-extrabold text-emerald-600 dark:text-emerald-400">${item.estSampai || '-'}</span>
                                    <span class="text-[9px] text-slate-500 dark:text-slate-400 block font-medium">${item.tglSampai || ''}</span>
                                </div>
                            </div>

                            <!-- Detail Container, DOS & Faktur -->
                            <div class="grid grid-cols-2 gap-2 items-center">
                                <!-- Box Muatan (Poin 5: Diperbesar) -->
                                <div class="flex items-center space-x-2 bg-amber-500/10 border border-amber-500/20 p-2 rounded-xl">
                                    <i class="fa-solid fa-boxes-packing text-amber-500 text-lg"></i>
                                    <div>
                                        <div class="text-sm font-extrabold text-amber-600 dark:text-amber-400 leading-none">
                                            ${item.jmlContainer} <span class="text-[10px] font-bold">CTN</span> / ${item.jmlDos} <span class="text-[10px] font-bold">DOS</span>
                                        </div>
                                        <span class="text-[9px] text-slate-400 font-medium">Total Muatan</span>
                                    </div>
                                </div>

                                <!-- Detail Faktur & Rp Faktur (Poin 6) -->
                                <div class="text-right pl-2">
                                    <span class="text-[10px] font-bold text-slate-400 block">No. Faktur</span>
                                    <span class="text-xs font-bold text-slate-800 dark:text-slate-200 block truncate">${item.noFaktur || '-'}</span>
                                    <span class="text-[11px] font-extrabold text-emerald-600 dark:text-emerald-400 block">${formatRupiah(item.rpFaktur)}</span>
                                </div>
                            </div>

                            <!-- Tombol Konfirmasi Berangkat (End Toko) -->
                            <div class="pt-1">
                                ${renderConfirmButton(item)}
                            </div>
                        </div>
                    `;
                });

                html += `
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // Render Tombol Konfirmasi Berangkat / Actual Timestamp
        function renderConfirmButton(item) {
            if (item.endToko) {
                return `
                <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-2 flex items-center justify-between text-xs text-emerald-600 dark:text-emerald-400 font-bold">
                    <span class="flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-check"></i> Actual Berangkat:
                    </span>
                    <span class="font-mono">${item.endToko}</span>
                </div>`;
            }

            return `
            <button onclick="confirmDeparture(${item.rowIndex}, this)" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-bold text-xs py-2.5 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-truck-arrow-right"></i>
                <span>Konfirmasi Berangkat (End Toko)</span>
            </button>`;
        }

        // Logika Status Real-Time & Selisih Waktu Tiba
        function calculateStatus(item) {
            if (item.endToko) {
                // Konfirmasi Sudah Diklik
                return {
                    badgeHtml: `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 flex items-center gap-1"><i class="fa-solid fa-check"></i> Selesai</span>`
                };
            }

            const now = new Date();
            const dateLoadingPart = parseDateString(item.tglLoading);
            
            if (!dateLoadingPart || !item.jamBerangkat) {
                return {
                    badgeHtml: `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-slate-500/20 text-slate-500 border border-slate-500/30">Belum Berangkat</span>`
                };
            }

            const [hh, mm] = item.jamBerangkat.split(':').map(Number);
            const departureTime = new Date(dateLoadingPart.year, dateLoadingPart.month - 1, dateLoadingPart.day, hh, mm);

            if (now < departureTime) {
                return {
                    badgeHtml: `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-500/20 text-amber-600 dark:text-amber-400 border border-amber-500/30 flex items-center gap-1"><i class="fa-solid fa-clock"></i> Belum Berangkat</span>`
                };
            } else {
                return {
                    badgeHtml: `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-sky-500/20 text-sky-500 border border-sky-500/30 animate-pulse flex items-center gap-1"><i class="fa-solid fa-truck-moving"></i> Dalam Perjalanan</span>`
                };
            }
        }

        // Action Trigger Konfirmasi Berangkat ke Google Apps Script
        async function confirmDeparture(rowIndex, btnElem) {
            if (!confirm("Apakah Anda yakin armada telah berangkat dari toko ini?")) return;

            btnElem.disabled = true;
            btnElem.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> <span>Menyimpan...</span>`;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'confirm',
                        rowIndex: rowIndex
                    })
                });

                const resData = await response.json();
                if (resData.status === "success") {
                    fetchData(); // Reload data langsung
                } else {
                    alert("Gagal menyimpan konfirmasi: " + resData.message);
                    btnElem.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert("Terjadi kesalahan jaringan.");
                btnElem.disabled = false;
            }
        }

        // Helper Parsers & Formatters
        function parseDateString(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                return { day: parseInt(parts[0]), month: parseInt(parts[1]), year: parseInt(parts[2]) };
            }
            return null;
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka || 0);
        }

        function showError(msg) {
            document.getElementById('shipmentContainer').innerHTML = `
                <div class="bg-rose-500/10 border border-rose-500/30 rounded-2xl p-6 text-center text-rose-500 space-y-2">
                    <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                    <p class="text-xs font-bold">${msg}</p>
                </div>`;
        }

        // Auto Refresh Setiap 15 Detik
        autoRefreshTimer = setInterval(() => {
            const modalHidden = document.getElementById('loginModal').classList.contains('hidden');
            if (modalHidden) {
                fetchData();
            }
        }, 15000);
    </script>
</body>
</html>
